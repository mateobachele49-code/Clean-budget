<style>
:root{--bg:#fff;--card:#f2f2f6;--tx:#000;--mu:#6e6e78;--ln:#e4e4ea;--ac:#7c5cff;--ok:#22c55e;--wa:#f59e0b;--ko:#ef4444}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{font-family:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}

.tot{font-size:46px;font-weight:700;letter-spacing:-.03em;text-align:center}
.mu{color:var(--mu);text-align:center;font-size:14px;margin-bottom:8px}.up{color:var(--ko)}.dn2{color:var(--ok)}
.dn{width:100%;max-width:300px;display:block;margin:8px auto}.dn text{fill:var(--mu);font-size:11px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 16px}
.kp div{background:var(--card);border-radius:16px;padding:12px;font-weight:600;font-size:15px}.kp small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.k2{grid-template-columns:repeat(2,1fr)}.fab.fab2{top:calc(env(safe-area-inset-top) + 8px);bottom:auto;right:16px;width:40px;height:40px;font-size:20px;box-shadow:0 2px 10px #0004;z-index:5}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}

.row span{flex:1;min-width:0}.row small{display:block;color:var(--mu);font-size:12px}.row em{font-style:normal;color:var(--mu);font-size:13px}.row b{font-weight:600;text-align:right}.pos{color:var(--ok)}

.sws{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--bg);outline:2px solid transparent}.sw.on{outline-color:var(--tx)}

input:not([type=color]){width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:13px;font:inherit;margin:6px 0}

.lb{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:600;font-size:16px;margin:10px 0}
.ghost{background:var(--card);color:var(--tx)}.dgr{background:var(--ko)}.red{color:var(--ko)}

.emp{color:var(--mu);text-align:center;margin:24px 0}.note{color:var(--mu);font-size:13px}

.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 16px}.card .btn{margin:10px 0 0;padding:10px;font-size:14px}.row[data-a]{cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--ln);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}

nav button span{font-size:22px;line-height:1}nav .on{color:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 20px #0006}

.sh h3{margin:0 0 12px}
body.so .ov{opacity:1;pointer-events:auto}body.so .sh{transform:none}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast b{margin-left:8px;text-decoration:underline;cursor:pointer}
/* ===== design v5 ===== */
:root{--r:20px;--sh:0 1px 2px rgba(20,20,40,.04),0 10px 28px rgba(20,20,40,.07);--g:rgba(255,255,255,.58);--gb:rgba(255,255,255,.9);--gs:0 10px 34px rgba(70,70,140,.14);--gh:inset 0 1px 0 rgba(255,255,255,.95);--ga:22%;--bl:18px}
