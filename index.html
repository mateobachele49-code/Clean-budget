<style>

.fh{display:flex;gap:14px;align-items:center;padding:16px}.fh .big{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-size:30px;flex:none;color:#fff}.fh b{font-size:18px;display:block}.fh small{line-height:1.4}
.sres .row small{white-space:normal}

.cvp{display:flex;flex-wrap:wrap;gap:8px 14px;padding:12px 16px;font-size:12.5px}.cvp span{display:flex;align-items:center;gap:5px}.cvp i{width:14px;height:14px;border-radius:50%;display:inline-block}
.qag{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}.qag label{display:flex;flex-direction:column;align-items:center;gap:4px}.qag small{font-size:11px}.qag input{width:100%;min-width:0;height:52px;border:1.5px solid transparent;border-radius:calc(var(--r)*.8);background:var(--card);text-align:center;font-size:18px;font-weight:600;outline:0;padding:0 2px;transition:border-color .2s}.qag input:focus{border-color:var(--ac)}
.hero small{font-size:14px;margin-top:4px}

.dw{margin:0 0 18px}

.dn{width:100%;height:100%;display:block}.dsk{fill:color-mix(in srgb,var(--card) 70%,transparent);stroke:var(--ln);stroke-width:.6}

:root[data-fab=left] .rb.p{order:-1}
:root[data-nv=bar] nav{left:0;right:0;bottom:0;max-width:none;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--ln)}

#sheet.on{pointer-events:auto}#sheet.on .bd{opacity:1}#sheet.on .pn{transform:none}
#set{background:var(--bg);overflow:auto;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}

.lnk{color:var(--ac)}
