 const tot=sum(W,"e"),lt=S.cats.reduce((a,c)=>a+(wm?wl(c):c.lim),0);if(lt>0)lb+=` sur <span class="m">${fmt(lt)}</span> de limites`;

function vSav(){const T=mtx(mk()),s=sum(T,"s"),cs=cum("s"),g=eg(),ms=[...Array(6)].map((_,i)=>mk(i-5)),vs=ms.map(m=>sum(mtx(m),"s")),mx=Math.max(...vs,g.m,1),list=T.filter(x=>x.t=="s").sort((a,b)=>b.d.localeCompare(a.d)).map(x=>opRow(x,1)).join("");

 ${F.t=="e"?cp("Catégorie")+`<div class="cg">${S.cats.map(c=>`<button class="${F.c==c.id?"on":""}" style="--c:${c.col}" data-a="fc" data-v="${c.id}"><i style="background:color-mix(in srgb,${c.col} 24%,transparent)">${c.ic}</i>${esc(c.n)}</button>`).join("")}</div>`:""}
 ${ed?"":sugs()}
 ${F.t=="e"&&duo?`<div class="card">${tgl("🤝 Dépense partagée 50/50","sp",F.sp,"fsw")}${F.sp?tgl("✅ Remboursée par l’autre","st",F.st,"fsw"):""}</div>`:""}
 ${F.t=="s"?cp("Projet")+`<div class="chips"><button class="chip${F.pj?"":" on"}" data-a="fpj" data-v="">Sans projet</button>${S.pj.map(p=>`<button class="chip${F.pj==p.id?" on":""}" data-a="fpj" data-v="${p.id}">${esc(p.ic)} ${esc(p.n)}</button>`).join("")}</div>`:""}

 <div class="grp"><input id="fn" placeholder="Commentaire" value="${esc(F.n)}">${S.o.tags||F.tg?`<input id="ftg" placeholder="Étiquettes (ex. vacances cadeau)" value="${esc(F.tg)}">`:""}<input id="fd" type="date" value="${F.d}" aria-label="Date"></div>
 ${S.o.photo||F.img?`<div class="card"><label class="row"><span class="gr">${F.img?"📷 Changer la photo du ticket":"📷 Ajouter une photo du ticket"}</span><input type="file" id="ph" accept="image/*" hidden></label>${F.img?`<img class="thumb" src="${F.img}" data-a="photo" alt="Ticket"><button class="row red" data-a="fimgx">Retirer la photo</button>`:""}</div>`:""}
 ${ed?"":`<div class="card">${tgl("🔁 Répéter chaque mois","rc",F.rc,"fsw")}</div>`}
 <button class="btn go" style="--tc:${tc}" data-a="saveTx">${ed?"Enregistrer":F.rc?"Créer le paiement récurrent":bt}</button>

 if(first&&!ed)setTimeout(()=>{const f=$("#fa");f&&f.focus()},380)}

 a.addEventListener("touchstart",e=>{go=S.o.swipe&&!e.target.closest("input,select,.chips");x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 a.addEventListener("touchend",e=>{if(!go)return;go=false;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<80||Math.abs(dx)<2*Math.abs(dy))return;const o=["res","bud","sav"],n=o.indexOf(tab)+(dx<0?1:-1);if(n<0||n>2)return;tab=o[n];render(dx<0?30:-30);scrollTo(0,0)},{passive:true})})();
/* tirer la fenêtre vers le bas pour la fermer */
(()=>{const s=$("#sheet");let y0=0,dy=0,on=false,p;
 s.addEventListener("touchstart",e=>{p=s.querySelector(".pn");if(!p||!p.contains(e.target)||p.scrollTop>0||e.touches[0].clientY-p.getBoundingClientRect().top>64)return;on=true;dy=0;y0=e.touches[0].clientY;p.style.transition="none"},{passive:true});
 s.addEventListener("touchmove",e=>{if(!on)return;dy=Math.max(0,e.touches[0].clientY-y0);p.style.transform="translateY("+dy+"px)"},{passive:true});
 s.addEventListener("touchend",()=>{if(!on)return;on=false;p.style.transition="";p.style.transform="";if(dy>110)closeSh()})})();
/* reflets qui suivent le doigt */
const GSEL=".card,.st>div,.tabs,.rb,.mn b,.mn button,.seg";
const glow=e=>{if(!S.o.track||!S.glass)return;const t=e.target.closest&&e.target.closest(GSEL);if(t){const r=t.getBoundingClientRect();t.style.setProperty("--mx",(e.clientX-r.left)+"px");t.style.setProperty("--my",(e.clientY-r.top)+"px")}};
document.addEventListener("pointerdown",glow,{passive:true});
document.addEventListener("pointermove",e=>{if(e.pointerType=="mouse")glow(e)},{passive:true});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){applyRec();render()}});

load();
y=+today().slice(0,4);mo=+today().slice(5,7)-1;yy=y;
applyTheme();applyRec();quick();render(0);
if(!S.ob){if(S.tx.length){S.ob=1;save()}else{OB={duo:S.mode=="duo"?1:0,a:"",b:""};setTimeout(drawOb,450)}}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
